  location: 서울
  email: 5395640@naver.com
  sections:
    summary:
      - '국내 전시·MICE 현장에서 전시 기획, 참가사 유치, 현장 운영을 맡아온 전시·행사 프로젝트 코디네이터입니다.'
    skills:
      - label: 핵심 역량
        details: 행사기획, 전시기획, 박람회 운영, 국제행사 운영, 참가사 유치, 현장 운영, 고객 경험, 콘텐츠 기획, SNS 마케팅, DX, AI 활용, AIX, 바이브 코딩, 업무 자동화, 모바일 웹
    experience:
      - company: (주)세계전람
        position: 전시1부 · 주임/팀원
        start_date: 2025-04
        end_date: present
        highlights:
          - 서울국제유아교육전·키즈페어, 인천 베이비&키즈페어 등 전시 기획 및 현장 운영
          - 특별관 기획, 참가사 유치, 현장 운영 관리
          - 3040 부모 관람객의 관심을 반영한 콘텐츠와 이벤트 기획
      - company: (주)덱스코
        position: MICE1팀 · 대리/팀원
        start_date: 2022-09
        end_date: 2024-06
        highlights:
          - WBC 2024 등 국제학술대회 전시·참가자 운영
          - 참가업체·부스·현장 운영 및 공식 프로그램 지원
      - company: (재)경주화백컨벤션센터(HICO)
        position: MICE사업팀 · 사원/팀원
        start_date: 2021-05
        end_date: 2022-01
        highlights:
          - 국제문화재산업전·한옥문화박람회 전시 지원
          - 홍보물·뉴스레터·카드뉴스 제작 및 현장 운영
    projects:
      - name: 모바일 스마트 럭키드로우
        summary: 기획·개발·배포
        highlights:
          - 수동 추첨을 모바일 웹 기반 실시간 랜덤 추첨 시스템으로 전환
          - AI·바이브 코딩으로 관리자 설정, 경품 재고·확률 가중치 흐름 구현
          - 운영 인력 2명에서 1명으로 개선, 행사 참여율 130% 향상
      - name: 뉴스레터 디자인
        summary: 콘텐츠 기획
        highlights:
          - 행사 소개, 개최일 카운트다운, 상세 프로그램, 전시 참가 및 참관 안내를 단계별 콘텐츠로 기획하였고, 이미지로 제작했습니다.
          - 긴 세로형 콘텐츠의 정보 구조와 사전 참여 흐름 설계
      - name: 카드뉴스 디자인
        summary: SNS 콘텐츠 운영
        highlights:
          - 관람객·참가업체·운영스탭별 행사 안내·홍보 콘텐츠 제작
          - 개최 안내, 부대행사, 참가업체, SNS 이벤트, 운영스탭 모집 콘텐츠 운영
    education:
      - institution: 계명대학교
        area: 경영학 · 관광경영학 복수전공
        degree: 4년제 졸업
    certifications:
      - 컨벤션기획사 2급 · 필기 합격(2025.03)
      - 컴퓨터활용능력 2급 · 필기 합격(2025.03)
      - 2종 보통 운전면허 · 최종 합격(2025.03)
    training:
      - 대구컨벤션뷰로 BE Planner 양성 과정 수료
      - 한국MICE협회 어서와, MICE는 처음이지? 수료
